[package]
name = "handpose-tract"
version = "0.1.0"
authors = ["ocramz"]
edition = "2024"
publish = false
description = "The hand-pose vision pipeline in tract: letterboxed frame → YOLO26 → decoded, canonicalized and tracked hands. Built to wasm for @ocramz/handpose."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# No default features: they bring CUDA, Metal, pulse and the CLI, which a browser build has no use for.
tract = { version = "=0.23.10", default-features = false, features = ["onnx", "wgpu", "unstable-wgpu-async"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
# tract-onnx-opl draws random numbers through getrandom, which needs to be told where entropy comes from in a browser.
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
# Must equal the wasm-bindgen CLI version that scripts/build-wasm.sh checks for.
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["OffscreenCanvas"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
pollster = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The native model test runs the real network: unoptimized tract takes minutes per frame.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
