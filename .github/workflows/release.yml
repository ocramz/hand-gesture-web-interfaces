# Publishes @ocramz/handpose to npm when a tag handpose-vX.Y.Z is pushed: runs the full CI (build, tests,
# tarball smoke test), then publishes that exact tarball through npm trusted publishing (OIDC, with
# provenance; no npm token) and attaches it to a GitHub release.
#
# One-time setup: see "Releasing" in the root README.
name: Release @ocramz/handpose

on:
  push:
    tags: ['handpose-v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11

      - name: Check the tag against the package version
        id: version
        run: |
          version=$(node -p 'require("./packages/handpose/package.json").version')
          if [ "${GITHUB_REF_NAME}" != "handpose-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match packages/handpose/package.json version ${version}" >&2
            exit 1
          fi
          # Prereleases (1.2.0-rc.1) go to the "next" dist-tag, not "latest".
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          echo "dist-tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: handpose-tarball
          path: dist-tarball

      - name: Publish to npm
        run: npm publish "dist-tarball/${{ needs.ci.outputs.tarball }}" --access public --tag "${{ steps.version.outputs.dist-tag }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist-tarball/${{ needs.ci.outputs.tarball }}" \
            --title "@ocramz/handpose ${GITHUB_REF_NAME#handpose-v}" --generate-notes \
            $([ "${{ steps.version.outputs.dist-tag }}" = next ] && echo --prerelease)
